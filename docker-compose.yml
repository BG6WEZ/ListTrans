version: '3.8'

services:
  matcher-app:
    image: material-matcher:v0.0.9
    container_name: material-matcher
    ports:
      - "18080:18080"
    # 生产部署约束：内存向量缓存、动态规则状态及 SQLite 独占写入依赖单进程模式，容器内默认保持单 worker 运行
    env_file:
      - .env
    volumes:
      # 持久化上传目录
      - ./app/uploads:/app/app/uploads
      # 持久化物料基础数据库
      - ./app/materials.db:/app/app/materials.db
      # 持久化用户及系统配置数据库
      - ./app/auth.db:/app/app/auth.db
      # 持久化向量索引缓存
      - ./app/vector_cache:/app/app/vector_cache
      # 挂载前端与核心代码目录以确保运行最新版本
      - ./web:/app/web
      - ./app:/app/app
      - ./config:/app/config
      - ./model_offline:/app/model_offline
      # 持久化日志输出
      - ./logs:/app/logs
    restart: always
