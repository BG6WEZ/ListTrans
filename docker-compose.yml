services:
  matcher-app:
    build: .
    image: material-matcher:v0.1.4
    container_name: material-matcher
    ports:
      - "18080:18080"
    # 生产部署约束：内存向量缓存、动态规则状态及 SQLite 独占写入依赖单进程模式，容器内默认保持单 worker 运行
    env_file:
      - .env
    volumes:
      # 挂载核心应用及持久化数据目录（包含 uploads, materials.db, auth.db, vector_cache）
      - ./app:/app/app
      - ./web:/app/web
      - ./config:/app/config
      - ./model_offline:/app/model_offline
      # 持久化日志输出
      - ./logs:/app/logs
    restart: always
